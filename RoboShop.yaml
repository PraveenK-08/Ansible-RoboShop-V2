- name: create instance
  hosts: localhost
  connection: local
  vars:
    instance:
      - mongodb
      - redis
      - mysql
      - rabbitmq
      - catalogue
      - user
      - cart
      - shipping
      - payment
      - dispatch
      - frontend

    action: create
    ami_id: ami-0055977a6e828a4f4

  tasks:
   - name: create EC2 instances
     amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       state: present
       region: "us-east-1"
       image_id: "{{ ami_id }}"
       instance_type: t3.micro
       security_groups: 
        - "roboshop-{{ item }}"
     loop: "{{ instance }}"
     when: action == "create"
     register: ec2_info

   - name: create R53 records for instances
     amazon.aws.route53:
       state: present
       zone: "teram.store"
       record: "{{ item.item }}.teram.store"
       type: A
       ttl: 1
       value: "{{item.instances[0].private_ip_address}}"
       overwrite: yes
     loop: "{{ ec2_info.results }}"

   - name: create R53 record for frontend server
     amazon.aws.route53:
       state: present
       zone: "teram.store"
       record: "teram.store"
       type: A
       ttl: 1
       value: "{{item.instances[0].public_ip_address}}"
       overwrite: yes
     loop: "{{ ec2_info.results }}"
     when: action == "create" and item.item == "frontend"
       
     