- name: creating repo file for rabbitmq
  copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo
- name: install rabbitmq
  package:
     name: 
      - rabbitmq-server
      - erlang
     state: present  
- name: start rabbitmq service
  service:
    name: rabbitmq-server
    state: started
    enabled: true
- name: create user for rabbitmq
  community.rabbitmq.rabbitmq_user:
   user: "{{ rabbitmq_user }}"
   password: "{{ rabbitmq_password }}"
   vhost: /
   configure_priv: .*
   read_priv: .*
   write_priv: .*
   state: present