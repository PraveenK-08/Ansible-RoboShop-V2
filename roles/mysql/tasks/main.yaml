- name: enable mysql 8 version
  command: dnf module enable mysql:8.4 -y
- name: install mysql
  package:
    name: mysql-server
    state: present
- name: start and enable mysql service
  service:
    name: mysqld
    state: started
    enabled: true
- name: set root password for mysql
  command: mysql_secure_installation --set-root-pass {{ mysql_password }}
